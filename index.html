<body>

  <!-- केंद्रीय खाली कंटेनर: मॉड्यूल्स यहीं लोड होंगे -->

      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>

  <!-- ऑटो-लोडर कनेक्शन: यहीं से आगे मॉड्यूल और चाबी/कॉन्फ़िग लोड होने का क्रम शुरू होगा -->
  <script type="module" src="./auto-loader.js"></script>

  <!-- नारद मुनि फ्लोटिंग क्लाउड बबल: बिना देरी के इंटरनेट जांच (1 सेकंड में अलर्ट) -->
  <style>
    #kks-narad-cloud-bubble {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translate(-50%, -18px);
      z-index: 2147483647;
      display: none;
      align-items: center;
      gap: 10px;
      max-width: 92vw;
      padding: 10px 16px;
      border-radius: 999px;
      background: #18181b;
      color: #ffffff;
      border: 1.5px solid #ef4444;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #kks-narad-cloud-bubble.is-visible {
      display: flex;
      opacity: 1;
      transform: translate(-50%, 0);
    }

    #kks-narad-cloud-bubble .kks-cloud-icon {
      font-size: 18px;
      line-height: 1;
    }

    #kks-narad-cloud-bubble .kks-cloud-retry {
      background: #dc2626;
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
  </style>

  <div id="kks-narad-cloud-bubble" role="alert" aria-live="assertive">
    <span class="kks-cloud-icon">☁️</span>
    <span id="kks-narad-cloud-text">
      इंटरनेट कनेक्शन नहीं है। कृपया अपने इंटरनेट कनेक्शन की जांच करें और दोबारा प्रयास करें।
    </span>
    <button type="button" class="kks-cloud-retry" id="kks-narad-retry-btn">दोबारा प्रयास</button>
  </div>

  <script>
    (function () {
      const bubble = document.getElementById("kks-narad-cloud-bubble");
      const retryBtn = document.getElementById("kks-narad-retry-btn");
      let offlineTimer = null;

      function showBubble() {
        if (!bubble) return;
        bubble.classList.add("is-visible");
      }

      function hideBubble() {
        if (!bubble) return;
        bubble.classList.remove("is-visible");
      }

      function checkNowWithOneSecondRule() {
        const isOnline = typeof navigator !== "undefined" ? navigator.onLine : true;
        if (!isOnline) {
          if (!offlineTimer) {
            offlineTimer = setTimeout(() => {
              offlineTimer = null;
              if (!navigator.onLine) {
                showBubble();
              }
            }, 1000);
          }
        } else {
          if (offlineTimer) {
            clearTimeout(offlineTimer);
            offlineTimer = null;
          }
          hideBubble();
        }
      }

      window.addEventListener("offline", checkNowWithOneSecondRule);
      window.addEventListener("online", checkNowWithOneSecondRule);

      if (retryBtn) {
        retryBtn.addEventListener("click", () => {
          if (navigator.onLine) {
            hideBubble();
          } else {
            showBubble();
          }
        });
      }

      checkNowWithOneSecondRule();
      setInterval(checkNowWithOneSecondRule, 1000);
    })();
  </script>
